<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auto Gifters Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@400;600;700&display=swap');

  :root {
    --red:    #e53935;
    --red2:   #ff1744;
    --blue:   #1565c0;
    --blue2:  #2979ff;
    --green:  #2e7d32;
    --green2: #00c853;
    --dark:   #0d0d0d;
    --card:   #1a1a1a;
    --text:   #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    padding: 12px;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 18px;
    padding: 14px;
    background: linear-gradient(135deg, #1a0000 0%, #0a0a1a 50%, #001a00 100%);
    border-radius: 16px;
    border: 1px solid #333;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 20px,
      rgba(255,255,255,0.01) 20px, rgba(255,255,255,0.01) 21px
    );
  }
  .header h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--red2), #fff, var(--green2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease infinite;
    background-size: 200% auto;
  }
  @keyframes shimmer {
    0%   { background-position: 0% center; }
    50%  { background-position: 100% center; }
    100% { background-position: 0% center; }
  }
  .header p { font-size: 12px; color: #888; margin-top: 4px; letter-spacing: 1px; }

  /* ── Section title ── */
  .section-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
    margin: 16px 0 8px 4px;
  }

  /* ── Button grid ── */
  .btn-grid { display: flex; flex-direction: column; gap: 8px; }
  .btn-row  { display: flex; gap: 8px; }

  /* ── Base button ── */
  .btn {
    flex: 1;
    padding: 14px 10px;
    border: none;
    border-radius: 12px;
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .btn:active { transform: scale(0.96); }

  /* Ripple */
  .btn::after {
    content: '';
    position: absolute;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    transform: scale(0);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .btn.ripple::after { transform: scale(3); opacity: 0; }

  /* ── Red button ── */
  .btn-red {
    background: linear-gradient(135deg, var(--red) 0%, #b71c1c 100%);
    box-shadow: 0 4px 15px rgba(229,57,53,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    border-top: 1px solid rgba(255,100,100,0.3);
    color: #fff;
    animation: pulse-red 3s ease infinite;
  }
  @keyframes pulse-red {
    0%,100% { box-shadow: 0 4px 15px rgba(229,57,53,0.35), inset 0 1px 0 rgba(255,255,255,0.1); }
    50%      { box-shadow: 0 4px 25px rgba(255,23,68,0.55),  inset 0 1px 0 rgba(255,255,255,0.1); }
  }

  /* ── Blue button ── */
  .btn-blue {
    background: linear-gradient(135deg, var(--blue2) 0%, var(--blue) 100%);
    box-shadow: 0 4px 15px rgba(41,121,255,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    border-top: 1px solid rgba(100,160,255,0.3);
    color: #fff;
    animation: pulse-blue 3s ease infinite;
    animation-delay: 1s;
  }
  @keyframes pulse-blue {
    0%,100% { box-shadow: 0 4px 15px rgba(41,121,255,0.35), inset 0 1px 0 rgba(255,255,255,0.1); }
    50%      { box-shadow: 0 4px 25px rgba(41,121,255,0.6),  inset 0 1px 0 rgba(255,255,255,0.1); }
  }

  /* ── Green button ── */
  .btn-green {
    background: linear-gradient(135deg, var(--green2) 0%, var(--green) 100%);
    box-shadow: 0 4px 15px rgba(0,200,83,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    border-top: 1px solid rgba(100,255,150,0.3);
    color: #fff;
    animation: pulse-green 3s ease infinite;
    animation-delay: 2s;
  }
  @keyframes pulse-green {
    0%,100% { box-shadow: 0 4px 15px rgba(0,200,83,0.3),  inset 0 1px 0 rgba(255,255,255,0.1); }
    50%      { box-shadow: 0 4px 25px rgba(0,200,83,0.55), inset 0 1px 0 rgba(255,255,255,0.1); }
  }

  /* ── Cycling color animation (ganti warna tiap 3 detik) ── */
  .btn-cycle {
    animation: color-cycle 9s ease infinite !important;
  }
  @keyframes color-cycle {
    0%,28%   { background: linear-gradient(135deg, var(--red2) 0%, var(--red) 100%);   box-shadow: 0 4px 20px rgba(255,23,68,0.45); }
    33%,61%  { background: linear-gradient(135deg, var(--blue2) 0%, var(--blue) 100%); box-shadow: 0 4px 20px rgba(41,121,255,0.45); }
    66%,94%  { background: linear-gradient(135deg, var(--green2) 0%, var(--green) 100%); box-shadow: 0 4px 20px rgba(0,200,83,0.45); }
    100%     { background: linear-gradient(135deg, var(--red2) 0%, var(--red) 100%);   box-shadow: 0 4px 20px rgba(255,23,68,0.45); }
  }

  /* Delay tiap button beda biar efek wave */
  .btn:nth-child(1) { animation-delay: 0s; }
  .btn:nth-child(2) { animation-delay: 0.3s; }

  .btn-row .btn:first-child { animation-delay: 0s; }
  .btn-row .btn:last-child  { animation-delay: 0.5s; }

  /* ── Icon ── */
  .btn-icon { font-size: 16px; }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #333, transparent);
    margin: 12px 0;
  }

  /* ── Toast notif ── */
  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #222;
    border: 1px solid #444;
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── Entrance animation ── */
  .btn-grid { animation: fadeUp 0.4s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .btn-grid > *:nth-child(1) { animation-delay: 0.05s; }
  .btn-grid > *:nth-child(2) { animation-delay: 0.10s; }
  .btn-grid > *:nth-child(3) { animation-delay: 0.15s; }
  .btn-grid > *:nth-child(4) { animation-delay: 0.20s; }
  .btn-grid > *:nth-child(5) { animation-delay: 0.25s; }
  .btn-grid > *:nth-child(6) { animation-delay: 0.30s; }
  .btn-grid > *:nth-child(7) { animation-delay: 0.35s; }
  .btn-grid > *:nth-child(8) { animation-delay: 0.40s; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ IZANOFFC BOT ⚡</h1>
  <p>SEMUA MENU 👑 — Pilih kategori yang kamu butuhkan</p>
</div>

<div class="section-title">▸ Main Menu</div>

<div class="btn-grid">

  <!-- Row: Owner (full width, merah) -->
  <div class="btn-row">
    <button class="btn btn-red btn-cycle" onclick="sendAction('menu_owner')">
      <span class="btn-icon">☕</span> Menu Owner
    </button>
  </div>

  <!-- Row: Admin + Jaga GB (biru) -->
  <div class="btn-row">
    <button class="btn btn-blue btn-cycle" style="animation-delay:1s" onclick="sendAction('menu_admin')">
      <span class="btn-icon">🛡️</span> Menu Admin
    </button>
    <button class="btn btn-blue btn-cycle" style="animation-delay:1.5s" onclick="sendAction('menu_jagagb')">
      <span class="btn-icon">🔒</span> Menu Jaga GB
    </button>
  </div>

  <!-- Row: Games (full width, hijau) -->
  <div class="btn-row">
    <button class="btn btn-green btn-cycle" style="animation-delay:2s" onclick="sendAction('menu_games')">
      <span class="btn-icon">🎮</span> Menu Games
    </button>
  </div>

  <!-- Row: More + Tqto (merah) -->
  <div class="btn-row">
    <button class="btn btn-red btn-cycle" style="animation-delay:0.5s" onclick="sendAction('menu_more')">
      <span class="btn-icon">🌀</span> Menu More
    </button>
    <button class="btn btn-red btn-cycle" style="animation-delay:0.8s" onclick="sendAction('menu_tqto')">
      <span class="btn-icon">✂️</span> Tqto
    </button>
  </div>

  <div class="divider"></div>

  <!-- Broadcast (hijau) -->
  <div class="btn-row">
    <button class="btn btn-green btn-cycle" style="animation-delay:2.5s" onclick="sendAction('menu_broadcast')">
      <span class="btn-icon">📢</span> BROADCAST BERBAYAR
    </button>
  </div>

  <!-- Request (hijau) -->
  <div class="btn-row">
    <button class="btn btn-green btn-cycle" style="animation-delay:3s" onclick="sendAction('menu_request')">
      <span class="btn-icon">📝</span> REQUEST FITUR BOT
    </button>
  </div>

  <div class="divider"></div>

  <!-- Back (merah) -->
  <div class="btn-row">
    <button class="btn btn-red btn-cycle" style="animation-delay:0.2s" onclick="sendAction('menu_back')">
      <span class="btn-icon">↩️</span> Back
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#0d0d0d');
    tg.setBackgroundColor('#0d0d0d');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function rippleEffect(btn) {
    btn.classList.remove('ripple');
    void btn.offsetWidth; // reflow
    btn.classList.add('ripple');
  }

  function sendAction(action) {
    const btn = event.currentTarget;
    rippleEffect(btn);

    if (tg && tg.sendData) {
      tg.sendData(JSON.stringify({ action }));
    } else {
      // Fallback: tampilkan toast kalau tidak di Telegram
      const labels = {
        menu_owner:     '👑 Menu Owner',
        menu_admin:     '🛡️ Menu Admin',
        menu_jagagb:    '🔒 Menu Jaga GB',
        menu_games:     '🎮 Menu Games',
        menu_more:      '🌀 Menu More',
        menu_tqto:      '✂️ Tqto',
        menu_broadcast: '📢 Broadcast Berbayar',
        menu_request:   '📝 Request Fitur Bot',
        menu_back:      '↩️ Back',
      };
      showToast('Tapped: ' + (labels[action] || action));
    }
  }
</script>
</body>
</html>
